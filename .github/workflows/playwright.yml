name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CI: true
      SABY_LOGIN: ${{ secrets.SABY_LOGIN }}
      SABY_PASSWORD: ${{ secrets.SABY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npm test

      - name: Prepare test-results artifact
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          Set-Content -Path test-results/artifact-placeholder.txt -Value "Playwright failure artifacts appear here; this run produced none."

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14
